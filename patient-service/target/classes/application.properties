spring.application.name=patient-service

server.port=8084

spring.datasource.url=jdbc:mysql://localhost:3306/patientdb
spring.datasource.username=${spring.datasource.username}
spring.datasource.password=${spring.datasource.password}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8081
# Alternative to issuer-uri if your auth service exposes jwk-set directly:
# spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8081/.well-known/jwks.json

eureka.client.service-url.defaultZone=http://localhost:8761/eureka

auth-user-service.url=http://localhost:8081
doctor-service.url=http://localhost:8082
appointment-service.url=http://localhost:8083

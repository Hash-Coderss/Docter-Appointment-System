spring.application.name=api-gateway
server.port=8085

# Eureka (service discovery)
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true


# Spring Cloud Gateway (WebMVC) routes
spring.cloud.gateway.server.webmvc.routes[0].id=doctor-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://DOCTOR-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/doctor/**
